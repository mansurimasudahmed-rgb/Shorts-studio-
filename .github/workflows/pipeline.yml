name: Pipeline
on:
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model ID from AI Studio
        default: gemini-flash-latest
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install edge-tts mutagen pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
      - name: Agent 1, Researcher
        run: python agents/researcher.py
      - name: Agent 2, Writer
        run: python agents/writer.py
      - name: Agent 3, Producer
        run: python agents/producer.py
      - name: Agent 4, Editor
        run: python agents/editor.py
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
